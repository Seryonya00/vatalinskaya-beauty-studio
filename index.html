            --bg-color: #0F0F11;
            --surface-color: #161618;
            --accent-color: #D4AF37;
            --accent-hover: #F3CA3E;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;

            -webkit-tap-highlight-color: transparent;

        html {

        body {

            line-height: 1.6;
            overflow-x: hidden;

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 80px;
            background: linear-gradient(to bottom, rgba(15, 15, 17, 0.3), var(--bg-color)), url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?ixlib=rb-4.0.3&auto=format&fit=crop&w=2074&q=80') center/cover no-repeat;
            background-attachment: fixed;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        .hero-logo-img {
            max-height: 280px;
            width: auto;
            margin-top: 15px;
            margin-bottom: 10px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            animation: fadeInDown 1s ease-out;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 4.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            line-height: 1.1;
            margin-bottom: 5px;
            color: #fff;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        .hero-contacts {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
            animation: fadeInUp 1s ease-out 0.6s backwards;
        }

        .social-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .social-circle:hover {
            border-color: var(--accent-color);
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-3px);
        }

        .social-circle svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            transition: fill 0.3s ease;
        }

        .social-circle:hover svg {
            fill: var(--accent-color);
        }

        /* --- BOTTOM NAVIGATION (DOCK) --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: rgba(22, 22, 24, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            z-index: 1001;
            width: calc(100% - 30px);
            max-width: 420px;
        }

        .nav-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 1;
        }

        .nav-group.left {
            padding-right: 35px;
        }

        .nav-group.right {
            padding-left: 35px;
        }

            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .b-nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .b-nav-item:hover, .b-nav-item.active {
            color: #fff;
            background: var(--glass-bg);
        }

        .b-nav-item:hover svg {
            transform: scale(1.15);
        }

            transform: translateX(-50%);
            width: 52px;
            height: 52px;
