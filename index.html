<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VATALINSKAYA BEAUTY STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #121214;
            --accent-gold: #d4af37;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a6;
            --font-title: 'Cormorant Garamond', serif;
            --font-body: 'Montserrat', sans-serif;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-body);
            padding: 40px 0;
        }

        /* --- СЕКЦИЯ НАШИ РАБОТЫ --- */
        #works {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .works-title {
            font-family: var(--font-title);
            font-size: 2.2rem;
            color: #d4af37;
            font-weight: 400;
            margin-bottom: 30px;
        }

        /* Шапка Instagram над сеткой */
        .insta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .insta-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
            transition: var(--transition);
        }

        .insta-user-info:hover {
            opacity: 0.85;
        }

        /* 3D Иконка Instagram */
        .insta-3d-icon {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(212, 36, 159, 0.3);
        }

        .insta-3d-icon svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .insta-handle {
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
        }

        /* Кнопка Подписаться / Слідкувати */
        .btn-follow {
            background-color: #eef1f4;
            color: #111111;
            padding: 10px 24px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 2px;
            transition: var(--transition);
        }

        .btn-follow:hover {
            background-color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        /* Сетка работ (3 колонки х 2 ряда) */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .work-card {
            position: relative;
            aspect-ratio: 1 / 1;
            background-size: cover;
            background-position: center;
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
        }

        .work-card:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        /* Иконка типы медиа в верхнем правом углу (Видео / Карусель) */
        .media-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));
        }

        .media-badge svg {
            width: 100%;
            height: 100%;
            fill: #ffffff;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 768px) {
            .works-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            
            .works-title {
                font-size: 1.8rem;
            }

            .btn-follow {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .works-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>
<body>

    </section>

</body>
