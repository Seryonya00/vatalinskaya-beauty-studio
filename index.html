    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: rgba(22, 22, 24, 0.75);
            --accent-gold: #d4af37;
            --accent-gold-glow: rgba(212, 175, 55, 0.25);
            --text-primary: #f5f5f7;
            --text-secondary: #c1c1c6;
            --font-title: 'Cormorant Garamond', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-body);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-family: var(--font-title);
            font-size: 1.8rem;
            color: var(--accent-gold);
            text-transform: lowercase;
            letter-spacing: 2px;
        }

        /* ПРАВКА 1: Кольорові іконки в шапці */
        .social-header {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .social-header a {
            display: inline-flex;
            transition: transform 0.3s ease;
        }

        .social-header a:hover {
            transform: scale(1.1);
        }

        .social-header svg {
            width: 24px;
            height: 24px;
        }

        /* Main Section */
        main {
            padding-top: 100px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-title {
            font-family: var(--font-title);
            font-size: 3rem;
            text-align: center;
            margin: 40px 0 20px;
            color: var(--text-primary);
        }

        /* Carousel Styles */
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
            margin: 40px auto;
            perspective: 1000px;
            overflow: hidden;
        }

        .carousel-stage {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        .card {
            position: absolute;
            width: 250px;
            height: 350px;
            left: calc(50% - 125px);
            top: 25px;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: transform 0.5s ease, opacity 0.5s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card h3 {
            color: var(--accent-gold);
            font-family: var(--font-title);
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .controls button {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: var(--font-body);
            transition: all 0.3s ease;
        }

        .controls button:hover {
            background: var(--accent-gold);
            color: var(--bg-dark);
        }

        /* Footer / Contact Section Styles */
        footer {
            width: 100%;
            background: rgba(15, 15, 15, 0.95);
            padding: 60px 5%;
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 30px;
        }

        /* ПРАВКА 3: Клікабельна адреса */
        .address-block a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px dashed var(--accent-gold);
            padding-bottom: 3px;
        }
        
        .address-block a:hover {
            color: var(--accent-gold);
        }

        .contact-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* Відстань між телефоном і соцмережами */
        }

        .phone-link {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent-gold);
            text-decoration: none;
            font-family: var(--font-title);
        }

        /* ПРАВКА 2: Соцмережі під номером, додано WhatsApp та змінено Viber */
        .footer-socials {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .footer-socials a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .footer-socials a:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px var(--accent-gold-glow);
            transform: translateY(-3px);
        }

        .footer-socials svg {
            width: 22px;
            height: 22px;
        }

    </style>

    <script>
        const stage = document.getElementById('stage');
        const cards = document.querySelectorAll('.card');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentIndex = 0;

        function updateCarousel() {
            const total = cards.length;
            cards.forEach((card, index) => {
                let offset = index - currentIndex;
                if (offset < 0) offset += total;
                
                let translateZ = 0;
                let translateX = 0;
                let opacity = 1;
                let zIndex = 0;

                if (offset === 0) {
                    translateZ = 0; translateX = 0; opacity = 1; zIndex = 3;
                } else if (offset === 1 || offset === - (total - 1)) {
                    translateZ = -150; translateX = 120; opacity = 0.6; zIndex = 2;
                } else if (offset === total - 1 || offset === -1) {
                    translateZ = -150; translateX = -120; opacity = 0.6; zIndex = 2;
                } else {
                    translateZ = -300; translateX = 0; opacity = 0; zIndex = 1;
                }

                card.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px)`;
                card.style.opacity = opacity;
                card.style.zIndex = zIndex;
            });
        }

        nextBtn.addEventListener('click', () => { currentIndex = (currentIndex + 1) % cards.length; updateCarousel(); });
        prevBtn.addEventListener('click', () => { currentIndex = (currentIndex - 1 + cards.length) % cards.length; updateCarousel(); });
        
        let startX = 0;
        let isDragging = false;
        
        stage.addEventListener('mousedown', e => { startX = e.pageX; isDragging = true; });
        stage.addEventListener('touchstart', e => { startX = e.touches[0].clientX; isDragging = true; });
        
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('touchend', () => { isDragging = false; });
        
        stage.addEventListener('mousemove', e => {
            if(!isDragging) return;
            const diffX = e.pageX - startX;
            if (diffX > 50) { currentIndex = (currentIndex - 1 + cards.length) % cards.length; updateCarousel(); isDragging = false; }
            else if (diffX < -50) { currentIndex = (currentIndex + 1) % cards.length; updateCarousel(); isDragging = false; }
        });
        
        stage.addEventListener('touchmove', e => {
            if(!isDragging) return;
            const diffX = e.touches[0].clientX - startX;
            if (diffX > 50) { currentIndex = (currentIndex - 1 + cards.length) % cards.length; updateCarousel(); isDragging = false; }
            else if (diffX < -50) { currentIndex = (currentIndex + 1) % cards.length; updateCarousel(); isDragging = false; }
        });

        // Ініціалізація
        updateCarousel();
    </script>
